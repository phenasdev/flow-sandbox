name: checks

# What the CI-fix loop watches. Runs on every feature branch push and on the
# pull request it opens against develop.
on:
  push:
    branches: ["feature/**", "develop", "release/**"]
  pull_request:
    branches: [develop, "release/**", main]

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — package.json's packageManager field is the single
      # source of truth, and specifying both makes action-setup refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  slow:
    name: slow job (observability)
    runs-on: ubuntu-latest
    steps:
      # Deliberately slow so /flow's CI-waiting behaviour is observable rather
      # than instantaneous. It is not a real check.
      - run: sleep 120
